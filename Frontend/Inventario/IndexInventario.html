        </div>
      </div>
      <div class="derecha">
        <div id="nombreHeader" class="nombre-usuario">Usuario</div>
        <div class="foto-perfil">
          <a href="../Usuario/IndexUsuario.html"><img id="imgHeaderSkin" src="../imagenes/Imagenesheader/SUKI.png" alt="Foto de perfil" /></a>
        </div>
        <div class="icono-menu" id="menuBtn">&#9776;</div>
      </div>

    <div class="sidebar" id="sidebar">
      <a href="../menu principal/indexMenuPrincipal.html">Objetivos</a>

    <div class="overlay" id="overlay"></div>

    <main>
    
<div class="hero-skin">
  <img id="imgPreviewSkin" alt="skin actual">
</div>
      <div id="gridSkins" class="skins-grid"></div>
      <section id="panelRuleta" class="panel-ruleta"></section>
      
    </main>
    <div id="modalRuleta" class="modal-ruleta" aria-hidden="true">
      <div class="modal-ruleta-contenido">
        <button id="btnCerrarRuletaX" class="btn-cerrar-ruleta" type="button" aria-label="Cerrar">×</button>

        <div class="ruleta-tablero">
          <div class="ruleta-puntero">▼</div>
          <div id="ruletaDisco" class="ruleta-disco"></div>
        </div>
        <p id="ruletaEstado" class="ruleta-estado">Girando...</p>
        <div id="ruletaPremioMedia" class="ruleta-premio-media" aria-live="polite">
          <img id="ruletaPremioImg" src="" alt="Premio ruleta" />
          <div id="ruletaPremioTexto" class="ruleta-premio-texto"></div>
        </div>
        <button id="btnCerrarRuleta" class="boton boton-cerrar-ruleta" type="button">Cerrar</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
